[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "noblecloak-claude-agent-sdk"
version = "0.0.0"
description = "Approvals for the Claude Agent SDK (Python): decide, ask, verify, retry."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "NobleCloak" }]
requires-python = ">=3.12"
dependencies = []
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Repository = "https://github.com/NobleCloak/noblecloak-claude-agent-sdk-py"

[tool.hatch.build.targets.wheel]
packages = ["src/noblecloak_claude_agent_sdk"]
